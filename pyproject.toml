[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudpan-sync"
version = "0.1.0"
description = "CloudPan Sync: transfer console between mainstream cloud providers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.39.0",
  "fastapi>=0.115.0",
  "guangyaclient>=0.0.2",
  "httpx>=0.28.0",
  "oss2>=2.19.1",
  "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
cloudpan-sync = "cloudpan_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
cloudpan_sync = [
  "web/index.html",
  "web/assets/*.css",
  "web/assets/*.js",
]

[tool.setuptools.packages.find]
where = ["src"]
