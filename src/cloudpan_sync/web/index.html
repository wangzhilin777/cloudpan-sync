<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudPan Sync</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1 id="appTitle">CloudPan Sync</h1>
        <p id="appSubtitle"></p>
      </div>
      <div class="topbar-actions">
        <select id="langSelect" aria-label="Language">
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
        </select>
        <button id="logoutBtn" class="ghost" hidden>Logout</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel login-panel" id="loginPanel">
        <h2 id="loginTitle"></h2>
        <label for="passwordInput" id="loginPasswordLabel"></label>
        <input id="passwordInput" type="password" />
        <button id="loginBtn"></button>
        <p id="loginError" class="error" hidden></p>
      </section>

      <section class="panel app-panel" id="appPanel" hidden>
        <nav class="tabs" id="tabs"></nav>
        <article class="placeholder" id="generalPanel">
          <p id="lockedText"></p>
        </article>
        <section class="auth-panel" id="authPanel" hidden>
          <h3 id="authTitle">Auth Management</h3>
          <div class="auth-grid">
            <input id="authDisplayName" type="text" placeholder="display name" />
            <select id="authProvider"></select>
            <select id="authMode">
              <option value="manual_token">manual_token</option>
              <option value="manual_cookie">manual_cookie</option>
              <option value="web_login_capture">web_login_capture</option>
            </select>
            <input id="authToken" type="text" placeholder="token (optional)" />
            <input id="authCookie" type="text" placeholder="cookie (optional)" />
            <button id="authSaveBtn">Save Auth</button>
          </div>
          <div class="auth-list-wrap">
            <button id="authReloadBtn" class="ghost">Reload</button>
            <ul id="authList" class="auth-list"></ul>
          </div>
        </section>
        <section class="queue-panel" id="queuePanel" hidden>
          <h3>Transfer Queue</h3>
          <div class="queue-actions">
            <button id="taskCreateDemoBtn">Create Demo Task</button>
            <button id="taskReloadBtn" class="ghost">Reload Queue</button>
          </div>
          <ul id="taskList" class="auth-list"></ul>
        </section>
      </section>
    </main>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
