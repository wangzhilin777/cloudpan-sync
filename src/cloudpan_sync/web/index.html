<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudPan Sync</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1 id="appTitle">CloudPan Sync</h1>
        <p id="appSubtitle"></p>
      </div>
      <div class="topbar-actions">
        <select id="langSelect" aria-label="Language">
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
        </select>
        <button id="logoutBtn" class="ghost" hidden>Logout</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel login-panel" id="loginPanel">
        <h2 id="loginTitle"></h2>
        <label for="passwordInput" id="loginPasswordLabel"></label>
        <input id="passwordInput" type="password" />
        <button id="loginBtn"></button>
        <p id="loginError" class="error" hidden></p>
      </section>

      <section class="panel app-panel" id="appPanel" hidden>
        <nav class="tabs" id="tabs"></nav>
        <article class="placeholder">
          <p id="lockedText"></p>
        </article>
      </section>
    </main>
  </div>

  <script src="/assets/app.js"></script>
</body>
</html>
