<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudPan Sync</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div>
        <h1 id="appTitle">CloudPan Sync</h1>
        <p id="appSubtitle"></p>
      </div>
      <div class="topbar-actions">
        <select id="langSelect" aria-label="Language">
          <option value="zh-CN">中文</option>
          <option value="en-US">English</option>
        </select>
        <button id="logoutBtn" class="ghost" hidden>Logout</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel login-panel" id="loginPanel">
        <h2 id="loginTitle"></h2>
        <label for="passwordInput" id="loginPasswordLabel"></label>
        <input id="passwordInput" type="password" />
        <button id="loginBtn"></button>
        <p id="loginError" class="error" hidden></p>
      </section>

      <section class="panel app-panel" id="appPanel" hidden>
        <nav class="tabs" id="tabs"></nav>
        <article class="placeholder" id="generalPanel">
          <section class="wizard-panel">
            <h3>New Task Wizard</h3>
            <div class="wizard-steps" id="wizardSteps"></div>
            <div class="wizard-tip">
              <span class="tip-icon" title="建议先跑扫描分析，再决定秒传或补传策略。">i</span>
              <span id="lockedText"></span>
            </div>
          </section>
        </article>
        <section class="auth-panel" id="authPanel" hidden>
          <h3 id="authTitle">Auth Management</h3>
          <div class="auth-toolbar">
            <button id="authOpenModalBtn" class="ghost">Open Auth Modal</button>
            <span class="tip-icon" title="网页登录抓取建议用于 cookie/token 不稳定的网盘。">?</span>
          </div>
          <div class="auth-grid">
            <input id="authDisplayName" type="text" placeholder="display name" />
            <select id="authProvider"></select>
            <select id="authMode">
              <option value="manual_token">manual_token</option>
              <option value="manual_cookie">manual_cookie</option>
              <option value="web_login_capture">web_login_capture</option>
            </select>
            <input id="authToken" type="text" placeholder="token (optional)" title="优先使用短期 token，避免长期明文暴露。" />
            <input id="authCookie" type="text" placeholder="cookie (optional)" title="cookie 失效后需重新抓取或登录。" />
            <button id="authSaveBtn">Save Auth</button>
          </div>
          <details class="advanced-block">
            <summary>Advanced Fields</summary>
            <div class="advanced-fields">
              <input id="authExtraHeader" type="text" placeholder="header: key=value" />
              <input id="authExtraDevice" type="text" placeholder="deviceId (optional)" />
            </div>
          </details>
          <div class="auth-list-wrap">
            <button id="authReloadBtn" class="ghost">Reload</button>
            <ul id="authList" class="auth-list"></ul>
          </div>
        </section>
        <section class="queue-panel" id="queuePanel" hidden>
          <h3>Transfer Queue</h3>
          <div class="queue-actions">
            <button id="taskCreateDemoBtn">Create Demo Task</button>
            <button id="taskReloadBtn" class="ghost">Reload Queue</button>
          </div>
          <ul id="taskList" class="auth-list"></ul>
        </section>
      </section>
    </main>
  </div>
  <dialog id="authModal" class="auth-modal">
    <form method="dialog" class="auth-modal-body">
      <h3>Web Login Capture</h3>
      <p id="authModalHint">Select provider and start capture guidance.</p>
      <div class="auth-grid one-col">
        <select id="authModalProvider"></select>
        <button id="authStartCaptureBtn" type="button">Start Capture Guide</button>
      </div>
      <pre id="authCaptureResult" class="capture-result"></pre>
      <button class="ghost" value="cancel">Close</button>
    </form>
  </dialog>

  <script src="/assets/app.js"></script>
</body>
</html>
